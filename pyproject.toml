[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skillevo"
version = "0.1.0"
description = "Local-first autonomous learning and skill lifecycle manager for Claude Code"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []
keywords = ["claude-code", "skills", "memory", "agents"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development",
]

[project.scripts]
skillevo = "skillevo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
